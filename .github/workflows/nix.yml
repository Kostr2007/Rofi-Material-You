name: Nix

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # Builds the package (with the unit tests), renders palettes with
      # matugen and evaluates the home-manager and NixOS modules.
      - run: nix flake check -L
